# Daily signals + scanner refresh.
#
# - Fetches VIX/VIX3M/BTC + the scanner universe, commits data/ back to the repo
# - On any signal TRANSITION (VIX zone change, term-structure flip, cycle-phase
#   change) it opens a GitHub issue -> GitHub emails everyone watching the repo
# - Every Monday it opens a digest issue regardless of transitions
# - Optional direct email: set repo secrets MAIL_USERNAME, MAIL_PASSWORD
#   (e.g. a Gmail app password) and MAIL_TO
#
# NOTE: scheduled workflows only run from the DEFAULT branch — this activates
# once the branch is merged. Use "Run workflow" (workflow_dispatch) to test.
name: Daily signals

on:
  schedule:
    - cron: "45 21 * * 1-5" # 21:45 UTC, weekdays — after the US close
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate signals & scanner
        id: gen
        run: node scripts/daily.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "chore: refresh signals $(date -u +%F)"; git push; }

      - name: Monday digest flag
        id: weekly
        run: echo "monday=$([ "$(date -u +%u)" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open issue (GitHub notifies watchers by email)
        if: steps.gen.outputs.alert == 'true' || steps.weekly.outputs.monday == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: ${{ steps.gen.outputs.title }}
        run: |
          if [ "${{ steps.gen.outputs.alert }}" = "true" ]; then TITLE="$ALERT_TITLE"; else TITLE="Weekly signal digest — $(date -u +%F)"; fi
          gh issue create --title "$TITLE" --body-file data/digest.md

      - name: Direct email (optional — needs MAIL_* secrets)
        if: (steps.gen.outputs.alert == 'true' || steps.weekly.outputs.monday == 'true') && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          to: ${{ env.MAIL_TO }}
          from: Signals Dashboard
          subject: ${{ steps.gen.outputs.title || 'Weekly signal digest' }}
          convert_markdown: true
          html_body: file://data/digest.md
